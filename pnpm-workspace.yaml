packages:
  - apps/*
  - packages/*
  - services/*

autoInstallPeers: true
engineStrict: true
saveExact: true
strictPeerDependencies: true

peerDependencyRules:
  allowedVersions:
    'openapi-typescript>typescript': '>=5 <7'

catalog:
  '@types/node': 26.6.6
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  eslint: 9.39.5
  next: 16.4.3
  react: 19.3.1
  react-dom: 19.3.1
  typescript: 6.0.3
  vitest: 5.0.5

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  unrs-resolver: true
