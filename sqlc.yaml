version: '2'
sql:
  - engine: postgresql
    schema: services/api/migrations
    queries: services/api/queries
    gen:
      go:
        package: store
        out: services/api/internal/store/sqlc
        sql_package: pgx/v5
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        overrides:
          - db_type: pg_catalog.numeric
            go_type: github.com/jackc/pgx/v5/pgtype.Numeric
