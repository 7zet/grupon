components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    Slug:
      name: slug
      in: path
      required: true
      schema: {type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'}
    Locale:
      name: locale
      in: query
      schema: {$ref: '#/components/schemas/Locale'}
    CitySlug:
      name: city
      in: query
      schema: {type: string}
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 1, default: 1}
    PageSize:
      name: page_size
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 24}
  responses:
    Problem:
      description: RFC 9457 problem with stable translation code
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
  schemas:
    Uuid:
      type: string
      format: uuid
    Locale:
      type: string
      enum: [uz, ru, en]
    Currency:
      type: string
      enum: [UZS]
    Role:
      type: string
      enum: [user, merchant_owner, merchant_manager, merchant_cashier, admin, moderator, support, finance, superadmin]
    LocalizedText:
      type: object
      required: [uz, ru, en]
      properties: {uz: {type: string}, ru: {type: string}, en: {type: string}}
      additionalProperties: false
    Problem:
      type: object
      required: [type, title, status, code]
      properties: {type: {type: string, format: uri-reference}, title: {type: string}, status: {type: integer, minimum: 400, maximum: 599}, detail: {type: string}, instance: {type: string, format: uri-reference}, code: {type: string, pattern: '^[a-z0-9_]+$'}, errors: {type: object, additionalProperties: {type: array, items: {type: string}}}}
    PageMeta:
      type: object
      required: [page, page_size, total]
      properties: {page: {type: integer, minimum: 1}, page_size: {type: integer, minimum: 1}, total: {type: integer, format: int64, minimum: 0}}
    Money:
      type: object
      description: Integer minor units; never floating point.
      required: [amount, currency]
      properties: {amount: {type: integer, format: int64}, currency: {type: string, enum: [UZS]}}
    City:
      type: object
      required: [id, slug, name, lat, lng]
      properties: {id: {$ref: '#/components/schemas/Uuid'}, slug: {type: string}, name: {$ref: '#/components/schemas/LocalizedText'}, lat: {type: number}, lng: {type: number}}
    CityList:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/City'}}}
    Subcategory:
      type: object
      required: [id, slug, name]
      properties: {id: {$ref: '#/components/schemas/Uuid'}, slug: {type: string}, name: {$ref: '#/components/schemas/LocalizedText'}}
    Category:
      type: object
      required: [id, slug, name, icon, searchable, deal_creation_enabled, publish_enabled, purchasable, redeemable, subcategories]
      properties: {id: {$ref: '#/components/schemas/Uuid'}, slug: {type: string}, name: {$ref: '#/components/schemas/LocalizedText'}, icon: {type: string}, searchable: {type: boolean}, deal_creation_enabled: {type: boolean}, publish_enabled: {type: boolean}, purchasable: {type: boolean}, redeemable: {type: boolean}, subcategories: {type: array, items: {$ref: '#/components/schemas/Subcategory'}}}
    CategoryList:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/Category'}}}
    PublicConfig:
      type: object
      required: [locales, currencies, cities, categories]
      properties: {locales: {type: array, items: {$ref: '#/components/schemas/Locale'}}, currencies: {type: array, items: {$ref: '#/components/schemas/Currency'}}, cities: {type: array, items: {$ref: '#/components/schemas/City'}}, categories: {type: array, items: {$ref: '#/components/schemas/Category'}}}
    DealStatus:
      type: string
      enum: [draft, in_review, approved, scheduled, active, paused, ended, archived, changes_requested]
    OrderStatus:
      type: string
      enum: [created, awaiting_payment, paid, completed, expired, failed, cancelled, partially_refunded, refunded]
    DealOption:
      type: object
      required: [id, title, original_price, deal_price, stock_total, stock_sold, stock_reserved, is_active]
      properties: {id: {$ref: '#/components/schemas/Uuid'}, title: {$ref: '#/components/schemas/LocalizedText'}, original_price: {$ref: '#/components/schemas/Money'}, deal_price: {$ref: '#/components/schemas/Money'}, stock_total: {type: integer, minimum: 0}, stock_sold: {type: integer, minimum: 0}, stock_reserved: {type: integer, minimum: 0}, is_active: {type: boolean}}
    DealMedia:
      type: object
      required: [id, url, alt, sort_order, width, height, blurhash]
      properties: {id: {$ref: '#/components/schemas/Uuid'}, url: {type: string, format: uri}, alt: {$ref: '#/components/schemas/LocalizedText'}, sort_order: {type: integer, minimum: 0}, width: {type: integer, minimum: 1}, height: {type: integer, minimum: 1}, blurhash: {type: string}}
    MerchantLocation:
      type: object
      required: [id, city, address, lat, lng, opening_hours, phone]
      properties: {id: {$ref: '#/components/schemas/Uuid'}, city: {$ref: '#/components/schemas/City'}, address: {type: string}, lat: {type: number}, lng: {type: number}, opening_hours: {type: object, additionalProperties: true}, phone: {type: string}}
    LocationList:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/MerchantLocation'}}}
    Merchant:
      type: object
      required: [id, slug, legal_name, display_name, description, phone, status, rating_avg, rating_count, commission_bps]
      properties: {id: {$ref: '#/components/schemas/Uuid'}, slug: {type: string}, legal_name: {type: string}, display_name: {type: string}, description: {$ref: '#/components/schemas/LocalizedText'}, logo_url: {type: [string, 'null'], format: uri}, cover_url: {type: [string, 'null'], format: uri}, phone: {type: string}, website: {type: [string, 'null'], format: uri}, instagram: {type: [string, 'null']}, telegram: {type: [string, 'null']}, status: {type: string, enum: [active, suspended]}, rating_avg: {type: number, minimum: 0, maximum: 5}, rating_count: {type: integer, minimum: 0}, commission_bps: {type: integer, minimum: 0, maximum: 10000}, locations: {type: array, items: {$ref: '#/components/schemas/MerchantLocation'}}, review_status: {type: string, enum: [draft, submitted, in_review, approved, rejected, suspended, terminated]}}
    DealSummary:
      type: object
      required: [id, slug, merchant, category, title, status, options, media, sold_count, rating_avg, rating_count, ends_at]
      properties: {id: {$ref: '#/components/schemas/Uuid'}, slug: {type: string}, merchant: {$ref: '#/components/schemas/Merchant'}, category: {$ref: '#/components/schemas/Category'}, title: {$ref: '#/components/schemas/LocalizedText'}, status: {$ref: '#/components/schemas/DealStatus'}, options: {type: array, minItems: 1, items: {$ref: '#/components/schemas/DealOption'}}, media: {type: array, items: {$ref: '#/components/schemas/DealMedia'}}, sold_count: {type: integer, minimum: 0}, rating_avg: {type: number, minimum: 0, maximum: 5}, rating_count: {type: integer, minimum: 0}, starts_at: {type: [string, 'null'], format: date-time}, ends_at: {type: string, format: date-time}}
    FaqItem:
