openapi: 3.1.0
info:
  title: Local Deals API
  version: 1.0.0
  description: API-first contract for marketplace, customer, checkout, and merchant experiences.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Configuration
  - name: Catalog
  - name: Authentication
  - name: Account
  - name: Orders
  - name: Merchant
  - name: Admin
security: []
paths:
  /api/v1/config:
    get:
      tags: [Configuration]
      operationId: getPublicConfig
      summary: Get locales, currencies, cities, categories, and exchange rate
      responses: {'200': {description: Public configuration, content: {application/json: {schema: {$ref: '#/components/schemas/PublicConfig'}}}}}
  /api/v1/homepage:
    get:
      tags: [Catalog]
      operationId: getHomepage
      summary: Get active homepage sections for a city
      parameters: [{$ref: '#/components/parameters/Locale'}, {$ref: '#/components/parameters/CitySlug'}]
      responses: {'200': {description: Homepage sections, content: {application/json: {schema: {$ref: '#/components/schemas/Homepage'}}}}, default: {$ref: '#/components/responses/Problem'}}
  /api/v1/cities:
    get:
      tags: [Catalog]
      operationId: listCities
      summary: List active cities
      responses: {'200': {description: Cities, content: {application/json: {schema: {$ref: '#/components/schemas/CityList'}}}}}
  /api/v1/categories:
    get:
      tags: [Catalog]
      operationId: listCategories
      summary: List active categories and subcategories
      responses: {'200': {description: Categories, content: {application/json: {schema: {$ref: '#/components/schemas/CategoryList'}}}}}
  /api/v1/deals:
    get:
      tags: [Catalog]
      operationId: listDeals
      summary: Search and filter published deals
      parameters: [{$ref: '#/components/parameters/Locale'}, {$ref: '#/components/parameters/CitySlug'}, {name: category, in: query, schema: {type: string}}, {name: subcategory, in: query, schema: {type: string}}, {name: q, in: query, schema: {type: string, maxLength: 200}}, {name: min_price, in: query, schema: {type: integer, format: int64, minimum: 0}}, {name: max_price, in: query, schema: {type: integer, format: int64, minimum: 0}}, {name: min_rating, in: query, schema: {type: number, minimum: 1, maximum: 5}}, {name: min_discount, in: query, schema: {type: integer, minimum: 0, maximum: 100}}, {name: ending_soon, in: query, schema: {type: boolean}}, {name: sort, in: query, schema: {type: string, enum: [recommended, popular, newest, price_asc, price_desc, biggest_discount, ending_soon]}}, {$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {description: Paginated deals, content: {application/json: {schema: {$ref: '#/components/schemas/DealPage'}}}}, default: {$ref: '#/components/responses/Problem'}}
  /api/v1/deals/{slug}:
    get:
      tags: [Catalog]
      operationId: getDeal
      summary: Get deal detail
      parameters: [{$ref: '#/components/parameters/Slug'}, {$ref: '#/components/parameters/Locale'}, {$ref: '#/components/parameters/CitySlug'}]
      responses: {'200': {description: Deal, content: {application/json: {schema: {$ref: '#/components/schemas/Deal'}}}}, default: {$ref: '#/components/responses/Problem'}}
  /api/v1/deals/{slug}/reviews:
    get:
      tags: [Catalog]
      operationId: listDealReviews
      summary: List published verified-purchase reviews for a deal
      parameters: [{$ref: '#/components/parameters/Slug'}, {$ref: '#/components/parameters/Locale'}, {$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {description: Reviews, content: {application/json: {schema: {$ref: '#/components/schemas/ReviewList'}}}}, default: {$ref: '#/components/responses/Problem'}}
  /api/v1/deals/{slug}/related:
    get:
      tags: [Catalog]
      operationId: listRelatedDeals
      summary: List related deals in the same subcategory and city
      parameters: [{$ref: '#/components/parameters/Slug'}, {$ref: '#/components/parameters/Locale'}, {$ref: '#/components/parameters/CitySlug'}]
      responses: {'200': {description: Related deals, content: {application/json: {schema: {$ref: '#/components/schemas/DealList'}}}}, default: {$ref: '#/components/responses/Problem'}}
  /api/v1/businesses/{slug}:
    get:
      tags: [Catalog]
      operationId: getBusiness
      summary: Get merchant profile, locations, deals, and reviews
      parameters: [{$ref: '#/components/parameters/Slug'}, {$ref: '#/components/parameters/Locale'}]
      responses: {'200': {description: Merchant profile, content: {application/json: {schema: {$ref: '#/components/schemas/MerchantProfile'}}}}, default: {$ref: '#/components/responses/Problem'}}
  /api/v1/search/suggestions:
    get:
      tags: [Catalog]
      operationId: getSearchSuggestions
      summary: Suggest deals, merchants, and categories
      parameters: [{name: q, in: query, required: true, schema: {type: string, minLength: 2, maxLength: 100}}, {$ref: '#/components/parameters/Locale'}, {$ref: '#/components/parameters/CitySlug'}]
      responses: {'200': {description: Suggestions, content: {application/json: {schema: {$ref: '#/components/schemas/SuggestionList'}}}}, default: {$ref: '#/components/responses/Problem'}}
  /api/v1/auth/phone/code:
    post:
      tags: [Account]
      operationId: requestPhoneCode
      summary: Send a one-time sign-in code to a phone number
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PhoneCodeRequest'}}}}
      responses: {'202': {description: Code sent, content: {application/json: {schema: {$ref: '#/components/schemas/PhoneCodeSent'}}}}, default: {$ref: '#/components/responses/Problem'}}
  /api/v1/auth/phone/verify:
    post:
      tags: [Account]
      operationId: verifyPhoneCode
      summary: Sign in with the code; creates the account on first use
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PhoneCodeVerify'}}}}
      responses: {'200': {description: Session, content: {application/json: {schema: {$ref: '#/components/schemas/AuthSession'}}}}, default: {$ref: '#/components/responses/Problem'}}
  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshSession
      summary: Rotate refresh token and detect reuse
      security: [{refreshCookie: []}, {bearerAuth: []}]
      responses: {'200': {description: Rotated session, content: {application/json: {schema: {$ref: '#/components/schemas/AuthSession'}}}}, default: {$ref: '#/components/responses/Problem'}}
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke current refresh token. Works with the refresh cookie or body alone when the access token has expired
      security: [{refreshCookie: []}, {cookieAuth: []}, {bearerAuth: []}]
      responses: {'204': {description: Signed out}, default: {$ref: '#/components/responses/Problem'}}
  /api/v1/me:
    get:
      tags: [Account]
      operationId: getMe
      summary: Get current profile
      security: [{cookieAuth: []}, {bearerAuth: []}]
      responses: {'200': {description: User, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}, default: {$ref: '#/components/responses/Problem'}}
    patch:
      tags: [Account]
      operationId: updateMe
      summary: Update profile preferences
      security: [{cookieAuth: []}, {bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateProfileRequest'}}}}
      responses: {'200': {description: Updated user, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}, default: {$ref: '#/components/responses/Problem'}}
    delete:
      tags: [Account]
      operationId: deleteMe
      summary: Soft-delete current account
      security: [{cookieAuth: []}, {bearerAuth: []}]
      responses: {'204': {description: Account deleted}, default: {$ref: '#/components/responses/Problem'}}
  /api/v1/me/orders:
    get:
      tags: [Account]
      operationId: listMyOrders
      summary: List current-user orders
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {description: Orders, content: {application/json: {schema: {$ref: '#/components/schemas/OrderPage'}}}}, default: {$ref: '#/components/responses/Problem'}}
  /api/v1/me/orders/{id}:
    get:
      tags: [Account]
      operationId: getMyOrder
      summary: Get current-user order
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: Order, content: {application/json: {schema: {$ref: '#/components/schemas/Order'}}}}, default: {$ref: '#/components/responses/Problem'}}
  /api/v1/me/vouchers:
    get:
      tags: [Account]
      operationId: listMyVouchers
      summary: List active, used, or expired vouchers
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters: [{name: status, in: query, schema: {type: string, enum: [active, redeemed, expired]}}, {$ref: '#/components/parameters/Page'}]
      responses: {'200': {description: Vouchers, content: {application/json: {schema: {$ref: '#/components/schemas/VoucherPage'}}}}, default: {$ref: '#/components/responses/Problem'}}
  /api/v1/me/vouchers/{id}:
    get:
      tags: [Account]
      operationId: getMyVoucher
      summary: Get offline-cacheable voucher detail
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: Voucher, content: {application/json: {schema: {$ref: '#/components/schemas/Voucher'}}}}, default: {$ref: '#/components/responses/Problem'}}
  /api/v1/me/recently-viewed:
    get:
      tags: [Account]
      operationId: listRecentlyViewed
      summary: List deals viewed in last 30 days
      security: [{cookieAuth: []}, {bearerAuth: []}]
      responses: {'200': {description: Deals, content: {application/json: {schema: {$ref: '#/components/schemas/DealList'}}}}}
    post:
      tags: [Account]
      operationId: recordRecentlyViewed
      summary: Record or merge a recently viewed deal
      security: [{cookieAuth: []}, {bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DealIdRequest'}}}}
      responses: {'204': {description: Recorded}, default: {$ref: '#/components/responses/Problem'}}
  /api/v1/me/reviews:
    get:
      tags: [Account]
      operationId: listMyReviews
      summary: List current-user reviews
      security: [{cookieAuth: []}, {bearerAuth: []}]
      responses: {'200': {description: Reviews, content: {application/json: {schema: {$ref: '#/components/schemas/ReviewList'}}}}}
  /api/v1/reviews:
    post:
      tags: [Account]
      operationId: createReview
      summary: Review one redeemed voucher once
      security: [{cookieAuth: []}, {bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateReviewRequest'}}}}
      responses: {'201': {description: Review, content: {application/json: {schema: {$ref: '#/components/schemas/Review'}}}}, default: {$ref: '#/components/responses/Problem'}}
  /api/v1/reviews/{id}:
    patch:
      tags: [Account]
      operationId: updateReview
      summary: Update owned review
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReviewInput'}}}}
      responses: {'200': {description: Review, content: {application/json: {schema: {$ref: '#/components/schemas/Review'}}}}, default: {$ref: '#/components/responses/Problem'}}
    delete:
      tags: [Account]
      operationId: deleteReview
      summary: Soft-delete owned review
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'204': {description: Deleted}, default: {$ref: '#/components/responses/Problem'}}
  /api/v1/reviews/{id}/report:
    post:
      tags: [Account]
      operationId: reportReview
      summary: Report abusive review
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReportRequest'}}}}
      responses: {'202': {description: Report accepted}, default: {$ref: '#/components/responses/Problem'}}
  /api/v1/orders:
    post:
      tags: [Orders]
      operationId: createOrder
      summary: Atomically create order and ten-minute stock reservations
      description: Same Idempotency-Key and body replays the order with 200. Same key with a different body is 422 idempotency_conflict.
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters: [{name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 16, maxLength: 200}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateOrderRequest'}}}}
      responses: {'200': {description: Replayed order for the same Idempotency-Key, content: {application/json: {schema: {$ref: '#/components/schemas/Order'}}}}, '201': {description: Order, content: {application/json: {schema: {$ref: '#/components/schemas/Order'}}}}, default: {$ref: '#/components/responses/Problem'}}
  /api/v1/orders/{id}/pay:
    post:
      tags: [Orders]
      operationId: payOrder
      summary: Create payment session
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PayOrderRequest'}}}}
      responses: {'200': {description: Payment session, content: {application/json: {schema: {$ref: '#/components/schemas/PaymentSession'}}}}, default: {$ref: '#/components/responses/Problem'}}
  /api/v1/payments/mock/{id}/complete:
    post:
      tags: [Orders]
      operationId: completeMockPayment
      summary: Simulate mock payment outcome
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MockOutcomeRequest'}}}}
      responses: {'202': {description: Mock webhook scheduled}, default: {$ref: '#/components/responses/Problem'}}
  /api/v1/payments/webhooks/{provider}:
    post:
      tags: [Orders]
      operationId: receivePaymentWebhook
      summary: Receive signed provider webhook idempotently
      parameters: [{name: provider, in: path, required: true, schema: {type: string, enum: [mock, payme, click, uzum]}}, {name: X-Webhook-Signature, in: header, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
      responses: {'204': {description: Accepted}, default: {$ref: '#/components/responses/Problem'}}
  /api/v1/merchants:
    post:
      tags: [Merchant]
      operationId: registerMerchant
      summary: Register business and assign owner role
      security: [{cookieAuth: []}, {bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RegisterMerchantRequest'}}}}
      responses: {'201': {description: Merchant, content: {application/json: {schema: {$ref: '#/components/schemas/Merchant'}}}}, default: {$ref: '#/components/responses/Problem'}}
  /api/v1/merchant/dashboard:
    get:
      tags: [Merchant]
      operationId: getMerchantDashboard
      summary: Get overview metrics, sales chart, latest orders, and pending deals
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters: [{name: from, in: query, schema: {type: string, format: date}}, {name: to, in: query, schema: {type: string, format: date}}]
      responses: {'200': {description: Dashboard, content: {application/json: {schema: {$ref: '#/components/schemas/MerchantDashboard'}}}}, default: {$ref: '#/components/responses/Problem'}}
  /api/v1/merchant/business:
    get:
      tags: [Merchant]
      operationId: getMerchantBusiness
      summary: Get current merchant business
      security: [{cookieAuth: []}, {bearerAuth: []}]
      responses: {'200': {description: Merchant, content: {application/json: {schema: {$ref: '#/components/schemas/Merchant'}}}}, default: {$ref: '#/components/responses/Problem'}}
    patch:
      tags: [Merchant]
      operationId: updateMerchantBusiness
      summary: Update business profile
      security: [{cookieAuth: []}, {bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MerchantInput'}}}}
      responses: {'200': {description: Merchant, content: {application/json: {schema: {$ref: '#/components/schemas/Merchant'}}}}, default: {$ref: '#/components/responses/Problem'}}
  /api/v1/merchant/locations:
    get:
      tags: [Merchant]
      operationId: listMerchantLocations
      summary: List branches
      security: [{cookieAuth: []}, {bearerAuth: []}]
      responses: {'200': {description: Locations, content: {application/json: {schema: {$ref: '#/components/schemas/LocationList'}}}}}
    post:
      tags: [Merchant]
      operationId: createMerchantLocation
      summary: Create branch
      security: [{cookieAuth: []}, {bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LocationInput'}}}}
      responses: {'201': {description: Location, content: {application/json: {schema: {$ref: '#/components/schemas/MerchantLocation'}}}}, default: {$ref: '#/components/responses/Problem'}}
  /api/v1/merchant/locations/{id}:
    patch:
      tags: [Merchant]
      operationId: updateMerchantLocation
      summary: Update branch
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LocationInput'}}}}
      responses: {'200': {description: Location, content: {application/json: {schema: {$ref: '#/components/schemas/MerchantLocation'}}}}, default: {$ref: '#/components/responses/Problem'}}
    delete:
      tags: [Merchant]
      operationId: deleteMerchantLocation
      summary: Delete branch
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'204': {description: Deleted}, default: {$ref: '#/components/responses/Problem'}}
  /api/v1/merchant/deals:
    get:
      tags: [Merchant]
      operationId: listMerchantDeals
      summary: List owned deals
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters: [{name: status, in: query, schema: {$ref: '#/components/schemas/DealStatus'}}, {$ref: '#/components/parameters/Page'}]
      responses: {'200': {description: Deals, content: {application/json: {schema: {$ref: '#/components/schemas/DealPage'}}}}}
    post:
      tags: [Merchant]
      operationId: createMerchantDeal
      summary: Create draft with options, media, and locations
      security: [{cookieAuth: []}, {bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DealInput'}}}}
      responses: {'201': {description: Deal, content: {application/json: {schema: {$ref: '#/components/schemas/Deal'}}}}, default: {$ref: '#/components/responses/Problem'}}
  /api/v1/merchant/deals/{id}:
    get:
      tags: [Merchant]
      operationId: getMerchantDeal
      summary: Get owned deal for editing
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: Deal, content: {application/json: {schema: {$ref: '#/components/schemas/Deal'}}}}, default: {$ref: '#/components/responses/Problem'}}
    put:
      tags: [Merchant]
      operationId: updateMerchantDeal
      summary: Replace owned deal draft
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DealInput'}}}}
      responses: {'200': {description: Deal, content: {application/json: {schema: {$ref: '#/components/schemas/Deal'}}}}, default: {$ref: '#/components/responses/Problem'}}
    delete:
      tags: [Merchant]
      operationId: deleteMerchantDeal
      summary: Soft-delete owned draft
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'204': {description: Deleted}, default: {$ref: '#/components/responses/Problem'}}
  /api/v1/merchant/deals/{id}/submit:
    post:
      tags: [Merchant]
      operationId: submitMerchantDeal
      summary: Submit complete deal for moderation
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: Pending-review deal, content: {application/json: {schema: {$ref: '#/components/schemas/Deal'}}}}, default: {$ref: '#/components/responses/Problem'}}
  /api/v1/merchant/orders:
    get:
      tags: [Merchant]
      operationId: listMerchantOrders
      summary: List orders containing merchant deals
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters: [{name: status, in: query, schema: {$ref: '#/components/schemas/OrderStatus'}}, {$ref: '#/components/parameters/Page'}]
      responses: {'200': {description: Orders, content: {application/json: {schema: {$ref: '#/components/schemas/OrderPage'}}}}}
  /api/v1/merchant/vouchers/lookup:
    post:
      tags: [Merchant]
      operationId: lookupMerchantVoucher
      summary: Resolve signed QR token or human code
      security: [{cookieAuth: []}, {bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VoucherLookupRequest'}}}}
      responses: {'200': {description: Voucher, content: {application/json: {schema: {$ref: '#/components/schemas/Voucher'}}}}, default: {$ref: '#/components/responses/Problem'}}
  /api/v1/merchant/vouchers/{id}/redeem:
    post:
      tags: [Merchant]
      operationId: redeemMerchantVoucher
      summary: Redeem voucher idempotently and audit the action
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RedeemRequest'}}}}
      responses: {'200': {description: Voucher, content: {application/json: {schema: {$ref: '#/components/schemas/Voucher'}}}}, default: {$ref: '#/components/responses/Problem'}}
  /api/v1/merchant/redemptions:
    get:
      tags: [Merchant]
      operationId: listMerchantRedemptions
      summary: List recent redemptions
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Page'}]
      responses: {'200': {description: Vouchers, content: {application/json: {schema: {$ref: '#/components/schemas/VoucherPage'}}}}}
  /api/v1/merchant/customers:
    get:
      tags: [Merchant]
      operationId: listMerchantCustomers
      summary: List customer aggregates
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Page'}]
      responses: {'200': {description: Customers, content: {application/json: {schema: {$ref: '#/components/schemas/CustomerPage'}}}}}
  /api/v1/merchant/analytics:
    get:
      tags: [Merchant]
      operationId: getMerchantAnalytics
      summary: Get sales and redemption analytics
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters: [{name: from, in: query, required: true, schema: {type: string, format: date}}, {name: to, in: query, required: true, schema: {type: string, format: date}}]
      responses: {'200': {description: Analytics, content: {application/json: {schema: {$ref: '#/components/schemas/MerchantAnalytics'}}}}, default: {$ref: '#/components/responses/Problem'}}
  /api/v1/merchant/payouts:
    get:
      tags: [Merchant]
      operationId: listMerchantPayouts
      summary: List payout periods
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Page'}]
      responses: {'200': {description: Payouts, content: {application/json: {schema: {$ref: '#/components/schemas/PayoutPage'}}}}}
  /api/v1/merchant/reviews:
    get:
      tags: [Merchant]
      operationId: listMerchantReviews
      summary: List reviews across merchant deals
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Page'}]
      responses: {'200': {description: Reviews, content: {application/json: {schema: {$ref: '#/components/schemas/ReviewList'}}}}}
  /api/v1/merchant/reviews/{id}/reply:
    put:
      tags: [Merchant]
      operationId: replyToMerchantReview
      summary: Create or edit single reply within 24 hours
      security: [{cookieAuth: []}, {bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReplyRequest'}}}}
      responses: {'200': {description: Review, content: {application/json: {schema: {$ref: '#/components/schemas/Review'}}}}, default: {$ref: '#/components/responses/Problem'}}
  /api/v1/merchant/media:
    get:
      tags: [Merchant]
      operationId: listMerchantMedia
      summary: List media library
      security: [{cookieAuth: []}, {bearerAuth: []}]
