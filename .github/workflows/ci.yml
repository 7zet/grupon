name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  pnpm:
    name: pnpm / lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  go:
    name: Go / build, vet, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download modules
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  generated-code:
    name: Generated code is current
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate TypeScript code
        run: pnpm gen

      - name: Download Go modules
        run: go mod download

      - name: Generate Go code
        run: go generate ./...

      - name: Verify generated code is committed
        shell: bash
        run: |
          if ! git diff --quiet --exit-code; then
            echo "::error::Generated tracked files are out of date. Run 'pnpm gen' and 'go generate ./...' and commit the result."
            git diff -- .
            exit 1
          fi

          untracked="$(git ls-files --others --exclude-standard)"
          if [[ -n "${untracked}" ]]; then
            echo "::error::Generation created untracked files. Run the generators and commit the result."
            printf '%s\n' "${untracked}"
            exit 1
          fi

  native-e2e:
    name: Native demo / Playwright purchase and merchant
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: app, POSTGRES_USER: app, POSTGRES_PASSWORD: app_dev_password }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app -d app" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://app:app_dev_password@localhost:5432/app?sslmode=disable
      DEMO_MODE: 'true'
      PAYMENT_MOCK_ENABLED: 'true'
      PAYMENT_MOCK_WEBHOOK_SECRET: '01234567890123456789012345678901'
      JWT_SECRET: '01234567890123456789012345678901'
      VOUCHER_QR_SECRET: '01234567890123456789012345678901'
      API_URL: http://127.0.0.1:8080/api/v1
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8080/api/v1
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: go build -o bin/grupon-api ./services/api/cmd/api
      - run: bash scripts/bootstrap-demo.sh
      - run: pnpm --filter @grupon/web build
      - name: Start API and web
        run: |
          ./bin/grupon-api > api.log 2>&1 &
          pnpm --filter @grupon/web start --port 3000 > web.log 2>&1 &
      - name: Wait for native services
        shell: bash
        run: |
          for second in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8080/readyz >/dev/null && curl -fsS http://127.0.0.1:3000/uz >/dev/null; then exit 0; fi
            sleep 1
          done
          echo '--- api.log ---'; cat api.log || true
          echo '--- web.log ---'; cat web.log || true
          echo '--- environment variable names ---'; env | cut -d= -f1 | sort
          exit 1
      - run: pnpm exec playwright test e2e/purchase.spec.mjs e2e/merchant.spec.mjs
