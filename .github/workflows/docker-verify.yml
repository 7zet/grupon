name: Docker verification

on:
  push: {branches: [main]}
  pull_request:

permissions: {contents: read}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Write demo environment
        shell: bash
        run: |
          cat > .env.ci <<'EOF'
          APP_ENV=production
          DEMO_MODE=true
          DATABASE_URL=postgres://app:app_dev_password@postgres:5432/app?sslmode=disable
          JWT_SECRET=01234567890123456789012345678901
          VOUCHER_QR_SECRET=01234567890123456789012345678901
          PAYMENT_MOCK_ENABLED=true
          PAYMENT_MOCK_WEBHOOK_SECRET=01234567890123456789012345678901
          SMS_PROVIDER=log
          WEB_PUBLIC_URL=http://localhost:3000
          MEDIA_PUBLIC_BASE=http://localhost:8080/media
          NEXT_PUBLIC_API_BASE_URL=http://api:8080/api/v1
          NEXT_PUBLIC_SITE_URL=http://localhost:3000
          EOF
          cp .env.ci .env.production
      - uses: docker/setup-buildx-action@v3
      - uses: docker/bake-action@v6
        with:
          files: docker-compose.prod.yml
          targets: api,worker,migrate,web,seed
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
      - name: Start demo stack
        shell: bash
        run: |
          ENV_FILE=.env.ci docker compose --profile ci -f docker-compose.prod.yml up -d postgres
          ENV_FILE=.env.ci docker compose -f docker-compose.prod.yml run --rm migrate
          ENV_FILE=.env.ci docker compose --profile seed -f docker-compose.prod.yml run --rm seed
          ENV_FILE=.env.ci docker compose -f docker-compose.prod.yml up -d api worker web
          until curl -fsS http://localhost:8080/readyz; do sleep 2; done
      - name: Smoke and backup restore
        shell: bash
        run: |
          curl -fsS http://localhost:3000/uz > /dev/null
          curl -fsS http://localhost:8080/healthz > /dev/null
          curl -fsS http://localhost:8080/readyz > /dev/null
          code=$(curl -fsS -X POST http://localhost:8080/api/v1/auth/phone/code -H 'content-type: application/json' -d '{"phone":"+998901234567"}' | jq -r .dev_code); test -n "$code"
          docker compose -f docker-compose.prod.yml exec -T postgres pg_dump -U app -Fc app > backup.dump
          docker compose -f docker-compose.prod.yml exec -T postgres psql -U app -c 'DROP TABLE audit_log CASCADE'
          docker compose -f docker-compose.prod.yml exec -T postgres pg_restore -U app -d app --clean --if-exists < backup.dump
          docker compose -f docker-compose.prod.yml exec -T postgres psql -U app -c 'SELECT 1 FROM audit_log LIMIT 1'
      - if: always()
        run: ENV_FILE=.env.ci docker compose --profile ci --profile seed -f docker-compose.prod.yml logs --no-color
